<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #10141a; color: #c7d0dc; font: 15px/1.6 system-ui, "Segoe UI", sans-serif;
    }
    .card { text-align: center; max-width: 34rem; padding: 2rem; }
    .brand { font-size: 22px; font-weight: 600; color: #e8edf4; margin: 0 0 .4rem; }
    .spinner {
      width: 28px; height: 28px; margin: 1.4rem auto; border-radius: 50%;
      border: 3px solid #2a3444; border-top-color: #4db8ff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta { color: #7d8a9d; font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand">DeepSeek Harness Desktop</h1>
    <p>Starting the embedded DeepSeek Harness engine&hellip;</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="meta" id="meta">Desktop <span id="app-version">…</span> &middot; harness <span id="dsh-version">…</span></p>
  </div>
  <script>
    if (window.desktop) {
      window.desktop.getInfo().then((info) => {
        document.getElementById('app-version').textContent = info.appVersion;
        document.getElementById('dsh-version').textContent = info.dshVersion;
      }).catch(() => {});
    }
  </script>
</body>
</html>
